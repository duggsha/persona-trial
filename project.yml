name: PersonaDesignTrial

options:
  bundleIdPrefix: com.largerentity.trial
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  PersonaCore:
    path: Packages/PersonaCore
  PersonaService:
    path: Packages/PersonaService
  PersonaDesign:
    path: Packages/PersonaDesign
  PersonaUI:
    path: Packages/PersonaUI

targets:
  PersonaDesignTrial:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    dependencies:
      - package: PersonaCore
      - package: PersonaService
      - package: PersonaDesign
      - package: PersonaUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Design Trial
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The mic is never uploaded anywhere, but the composer's hold-to-record
        # gesture is live chrome and iOS requires the string to exist.
        NSMicrophoneUsageDescription: The design trial records nothing; this is here so the composer's hold gesture can animate.
        # Loopback-only, and nothing is ever sent — but ATS still has to permit
        # the dead http:// base URL the trial's client is pointed at.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.largerentity.trial.designtrial
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
